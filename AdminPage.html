<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Sayfası</title>
  <script src="https://cdn.tailwindcss.com"></script>
     <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css"
    />
  <link rel="stylesheet" href="Theme.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    body { font-family: 'Outfit', sans-serif; }


    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse-slow {
      0%, 100% { opacity: 0.15; }
      50%       { opacity: 0.32; }
    }
    @keyframes scan {
      0%   { top: 0%; opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { top: 100%; opacity: 0; }
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(12px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    .fade-up { animation: fadeUp 0.65s ease both; }
    .fade-up-1 { animation-delay: 0.05s; }
    .fade-up-2 { animation-delay: 0.15s; }
    .fade-up-3 { animation-delay: 0.25s; }
    .fade-up-4 { animation-delay: 0.35s; }
    .pulse-slow { animation: pulse-slow 4s ease-in-out infinite; }
    .scan-line {
      position: absolute; width: 100%; height: 2px;
      background: linear-gradient(90deg, transparent, rgba(99,202,183,0.6), transparent);
      animation: scan 3s ease-in-out infinite;
    }
    .field-enter { animation: slideIn 0.28s ease both; }

    .input-field {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      color: #f1f5f9;
      transition: border-color 0.2s, background 0.2s;
    }
    .input-field::placeholder { color: rgba(255,255,255,0.22); }
    .input-field:focus {
      outline: none;
      border-color: rgba(99,202,183,0.6);
      background: rgba(255,255,255,0.07);
    }

    .tab-btn {
      position: relative;
      padding-bottom: 10px;
      font-weight: 600;
      font-size: 0.95rem;
      transition: color 0.2s;
    }
    .tab-btn::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0;
      height: 2px; width: 0;
      background: #63cab7;
      transition: width 0.3s ease;
      border-radius: 2px;
    }
    .tab-btn.active { color: #63cab7; }
    .tab-btn.active::after { width: 100%; }
    .tab-btn:not(.active) { color: rgba(255,255,255,0.28); }

    .btn-primary {
      background: linear-gradient(135deg, #63cab7 0%, #3b9e8a 100%);
      transition: opacity 0.2s, transform 0.15s;
      font-family: 'Syne', sans-serif;
      font-weight: 600;
    }
    .btn-primary:hover { opacity: 0.88; transform: translateY(-1px); }
    .btn-primary:active { transform: translateY(0px); }
    .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

 .card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 24px;
  transition: 0.3s;
}

.card:hover {
  transform: translateY(-5px);
  box-shadow: 0 10px 25px rgba(0,0,0,0.1);
}
  </style>
</head>
<body class="min-h-screen flex" style="background: var(--bg-primary);">

<div id="AdminMenu"></div>
<div id="themeBtn" style="right: 30px; position: fixed; top:15px;"></div>

<main class="flex-1 p-8">
<header style="border: var(--border-one) 2px solid;   background-color: var(--bg-thiry);"  class="mb-8 flex items-center justify-center gap-8 dark:bg-background-dark p-8 rounded-xl  transition-all duration-00 ease-in-out">

  <img id="userProfile"  alt="Profil" style="border:solid 3px #37ff00ec;" class="w-20 h-20 rounded-full border border-slate-900 "/>
  <div class="text-center ">
    <h2 class="text-3xl font-bold text-slate-900 dark:text-white" style="color: var(--text-primary);">Hoşgeldin</h2>
    <span id="username" class="block text-1xl font-semibold text-slate-700 dark:text-gray-300" style="color: var(--text-second);"></span>
    <p id="changingText" class="text-slate-500 transition-opacity duration-500" style="color: var(--text-yellow); font-size: large; "></p>
  </div>
</header> 


</header>

<section class="mt-8">
 

  <div id="generalDataGrid" class="grid grid-cols-2 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
  <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-6">

    <div class="card">
      <p class="text-sm uppercase tracking-wider mb-3" style="color: var(--text-muted);">Bulgu Dağılımı</p>
      <div id="findingLegend" class="flex flex-wrap gap-2 mb-3"></div>
      <div style="position:relative; height:220px;">
        <canvas id="findingChart" role="img" aria-label="Bulgu dağılımı grafiği"></canvas>
      </div>
    </div>
  
    <div class="card">
      <p class="text-sm uppercase tracking-wider mb-3" style="color: var(--text-muted);">En Çok Analiz Yapılan Organlar</p>
      <div id="organLegend" class="flex flex-wrap gap-2 mb-3"></div>
      <div style="position:relative; height:220px;">
        <canvas id="organChart" role="img" aria-label="Organ analiz grafiği"></canvas>
      </div>
    </div>
  
  </div>

</section>
</body>
<script>
  document.addEventListener('DOMContentLoaded', async () => {
     Theme.renderToggle('themeBtn');
   const user = await getCurrentUser();
   let UserProfile = document.getElementById("userProfile");
   UserProfile.src = user.profile;
  });
  
</script>
<script src="MenuLoader.js"></script>
<script src="auth.js"></script>
<script src="AdminMenuOptions.js"></script>
<script src="Template.js"></script>
<script>
  
  (function () {
    "use strict";

    const GENERAL_DATA_ENDPOINT = "http://localhost:8000/api/v1/Other/GeneralData";
    
    const pick = (id) => document.getElementById(id);
    const esc = (v) => String(v ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#39;");

    const COLORS = [
    "#378ADD", "#1D9E75", "#D85A30",
    "#7F77DD", "#BA7517", "#D4537E",
    "#639922", "#E24B4A", "#888780"
  ];

    const labelMap = {
      total_analyses: "Toplam Analiz",
      total_analyses: "Toplam Analiz",
      total_patients: "Toplam Hasta",   
      total_users: "Toplam Kullanıcı",  
      total_roles: "Toplam Rol",
      total_users: "Toplam Kullanici",
      analyses_today:"Bugün analizi",
      analyses_this_week:"Bu Haftada",
      active_users:"Aktif Kullanıcı",
      new_users_today:"Bugün Yeni kayıt",
      positive_rate:"Doğruluk oranı",
      total_staff: "Toplam Personel",
      total_analysis_nowdate: "Bugun Analiz",
      today_findings: "Bugun Bulgu",
      avg_confidence: "Ortalama Guven",
      accuracy_rate: "Dogruluk Orani"
    }; 


    function setMsg(text, isErr) {
      const el = pick("generalDataMessage");
      if (!el) return;
      el.textContent = text || "";
      el.style.color = isErr ? "#ef4444" : "var(--text-muted)";
    }

    function firstFiniteNumber(...values) {
      for (const value of values) {
        const n = Number(value);
        if (Number.isFinite(n)) return n;
      }
      return null;
    }

    function extractApiCount(payload, source) {
      const meta = source?.meta && typeof source.meta === "object" ? source.meta : {};
      const pagination = source?.pagination && typeof source.pagination === "object" ? source.pagination : {};
      const sourceCount = firstFiniteNumber(
        source?.count,
        source?.total,
        source?.total_count,
        source?.totalCount,
        meta?.count,
        meta?.total,
        pagination?.count,
        pagination?.total,
        payload?.count,
        payload?.total,
        payload?.total_count,
        payload?.totalCount
      );
      return sourceCount;
    }

    function normalizeGeneralData(payload) {
      if (!payload || typeof payload !== "object") return {};
      const source = payload.data && typeof payload.data === "object" ? payload.data : payload;
      const out = {};
      const SKIP = new Set(["finding_distribution", "best_organs"]); // ← bu satırı ekle

      Object.keys(source).forEach((key) => {
        const value = source[key];
        if (SKIP.has(key)) return;
        if (value == null) return;
        if (typeof value === "number" || typeof value === "string" || typeof value === "boolean") {
          out[key] = value;
        }
      });

      const apiCount = extractApiCount(payload, source);
      if (apiCount !== null) {
        out.total_analyses = apiCount;
      }

      return out;
    }

    function buildLegend(containerId, labels, colors) {
      const el = pick(containerId);
      if (!el) return;
      el.innerHTML = labels.map((lbl, i) =>
        `<span style="display:flex;align-items:center;gap:4px;font-size:12px;color:var(--text-muted);">
          <span style="width:10px;height:10px;border-radius:2px;background:${colors[i % colors.length]};flex-shrink:0;"></span>
          ${esc(lbl)}
        </span>`
      ).join("");
    }

    let findingChartInstance = null;
    let organChartInstance = null;

    function renderFindingChart(distribution) {
      const canvas = pick("findingChart");
      if (!canvas || typeof Chart === "undefined") return;
      const filtered = distribution.filter((d) => d.type !== null && d.type !== undefined);
      if (!filtered.length) return;
      const labels = filtered.map((d) => d.type);
      const data   = filtered.map((d) => d.count);
      const colors = labels.map((_, i) => COLORS[i % COLORS.length]);
      buildLegend("findingLegend", labels, colors);
      if (findingChartInstance) findingChartInstance.destroy();
      findingChartInstance = new Chart(canvas, {
        type: "doughnut",
        data: { labels, datasets: [{ data, backgroundColor: colors, borderWidth: 1, borderColor: "rgba(128,128,128,0.15)" }] },
        options: {
          responsive: true, maintainAspectRatio: false, cutout: "58%",
          plugins: { legend: { display: false }, tooltip: { callbacks: { label: (ctx) => ` ${ctx.label}: ${ctx.parsed}` } } }
        }
      });
    }

    function renderOrganChart(organs) {
      const canvas = pick("organChart");
      if (!canvas || typeof Chart === "undefined") return;
      if (!organs.length) return;
      const labels = organs.map((o) => o.name.charAt(0).toUpperCase() + o.name.slice(1));
      const data   = organs.map((o) => o.count);
      const colors = labels.map((_, i) => COLORS[i % COLORS.length]);
      buildLegend("organLegend", labels, colors);
      canvas.parentElement.style.height = Math.max(180, labels.length * 44 + 60) + "px";
      if (organChartInstance) organChartInstance.destroy();
      organChartInstance = new Chart(canvas, {
        type: "bar",
        data: { labels, datasets: [{ data, backgroundColor: colors, borderRadius: 4, borderSkipped: false }] },
        options: {
          indexAxis: "y", responsive: true, maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { color: "rgba(128,128,128,0.1)" }, ticks: { font: { size: 12 }, color: "rgba(128,128,128,0.9)" } },
            y: { grid: { display: false }, ticks: { font: { size: 13 }, color: "rgba(128,128,128,0.9)" } }
          }
        }
      });
    }

    function prettyLabel(key) {
      if (labelMap[key]) return labelMap[key];
      return key
        .replaceAll("_", " ")
        .replace(/\b\w/g, (c) => c.toUpperCase());
    }

    function prettyValue(key, value) {
      if (typeof value === "boolean") return value ? "Evet" : "Hayir";
      if (typeof value === "number" && /rate|accuracy|confidence/i.test(key)) return `${value}%`;
      return String(value);
    }

    function renderGeneralDataCards(data) {
      const grid = pick("generalDataGrid");
      if (!grid) return;

      const entries = Object.entries(data);
      if (!entries.length) {
        grid.innerHTML = `
          <article class="rounded-xl border p-4" style="border-color: var(--border); background: var(--bg-card);">
            <p class="text-sm" style="color: var(--text-muted);">Gosterilecek genel veri bulunamadi.</p>
          </article>
        `;
        return;
      }

      grid.innerHTML = entries.map(([key, value]) => `
        <article class="rounded-xl border p-4" style="border-color: var(--border); background: var(--bg-card);">
          <p class="text-xs uppercase tracking-wider" style="color: var(--text-muted);">${esc(prettyLabel(key))}</p>
          <p class="mt-2 text-2xl font-bold" style="color: var(--text-second);">${esc(prettyValue(key, value))}</p>
        </article>
      `).join("");
    }

    async function loadGeneralData() {
      const refreshBtn = pick("refreshGeneralDataBtn");
      const rawEl = pick("generalDataRaw");
      if (refreshBtn) refreshBtn.disabled = true;
      setMsg("Genel veri yukleniyor...", false);

      try {
        const res = await fetch(GENERAL_DATA_ENDPOINT, { credentials: "include", method: "GET" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const payload = await res.json();
        const normalized = normalizeGeneralData(payload);
        renderGeneralDataCards(normalized);
        const src = payload.data && typeof payload.data === "object" ? payload.data : payload;
        if (Array.isArray(src.finding_distribution)) renderFindingChart(src.finding_distribution);
        if (Array.isArray(src.best_organs))          renderOrganChart(src.best_organs);
        if (rawEl) rawEl.textContent = JSON.stringify(payload, null, 2);
        setMsg("Genel veri guncellendi.", false);
      } catch (err) {
        renderGeneralDataCards({});
        if (rawEl) rawEl.textContent = "";
        setMsg(`Genel veri alinamadi: ${err.message}`, true);
      } finally {
        if (refreshBtn) refreshBtn.disabled = false;
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      const refreshBtn = pick("refreshGeneralDataBtn");
      if (refreshBtn) {
        refreshBtn.addEventListener("click", loadGeneralData);
      }
      loadGeneralData();
    });
  })();
  
</script>
<script>
document.addEventListener("DOMContentLoaded", () => {
    const messages = [
        `Bugün neler olur bitiğini görün  ${new Date().toLocaleDateString()}`,
        `Bugünün Kanama Sayısı 0`,
    ];

    const textElem = document.getElementById("changingText");
    let index = 0;

    function changeText() {
        textElem.style.opacity = 0;
        setTimeout(() => {
            textElem.textContent = messages[index];
            textElem.style.opacity = 1;
            index = (index + 1) % messages.length;
        }, 900);
    }

    changeText(); 
    setInterval(changeText, 3500); 
});</script>
</html>
