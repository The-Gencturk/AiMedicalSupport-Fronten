<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kullanici Detaylari</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css" />
  <link rel="stylesheet" href="Theme.css" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Outfit', sans-serif; }
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
    }
    .role-chip {
      border: 1px solid var(--border);
      background: var(--bg-secondary);
      color: var(--text-second);
      border-radius: 9999px;
      padding: 4px 10px;
      font-size: 12px;
      line-height: 1.4;
    }

    .btn {
      border: 1px solid var(--border);
      background: var(--bg-secondary);
      color: var(--text-second);
      padding: 10px 12px;
      border-radius: 12px;
      font-weight: 600;
      transition: filter 0.2s, transform 0.15s, background 0.2s;
      user-select: none;
    }
    .btn:hover { filter: brightness(1.05); }
    .btn:active { transform: translateY(1px); }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; filter: none; }

    .btn-primary {
      border-color: transparent;
      background: linear-gradient(135deg, var(--accent-light), var(--accent));
      color: #ffffff;
    }

    .roles-editor-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg-secondary);
      color: var(--text-second);
    }
    .roles-editor-item input[type="checkbox"] { accent-color: var(--accent); width: 16px; height: 16px; }

    .link-muted { color: var(--text-muted); }
    .link-muted:hover { color: var(--accent); }
  </style>
</head>
<body class="min-h-screen flex" style="background: var(--bg-primary); color: var(--text-second);">
  <div id="AdminMenu"></div>
  <div id="themeBtn" style="right: 30px; position: fixed; top: 15px;"></div>

  <main class="flex-1 p-4 md:p-8">
    <a href="Users.html" class="inline-flex items-center gap-2 link-muted mb-6">
      <i class="fa-solid fa-arrow-left"></i>
      <span>Geri</span>
    </a>

    <div id="errorMessage" class="hidden mb-6 rounded-xl border border-red-400/30 bg-red-500/10 px-4 py-3 text-red-200"></div>

    <section class="card mb-6">
      <div class="flex flex-col md:flex-row md:items-center gap-5">
        <img id="profileImage" class="w-24 h-24 rounded-full object-cover border border-white/10" src="/TemplateImage/miniverse_logo.jpg" alt="Profil" />

        <div class="flex-1">
          <h1 id="fullName" class="text-2xl md:text-3xl font-bold" style="color: var(--text-second);">-</h1>
          <p id="email" class="mt-1" style="color: var(--text-muted);">-</p>

          <div class="mt-3 flex flex-wrap items-center gap-2">
            <span id="statusBadge" class="px-2 py-1 text-xs rounded-full">-</span>
            <span id="specialtyBadge" class="px-2 py-1 text-xs rounded-full bg-primary/20 text-primary">-</span>
          </div>
        </div>
      </div>
    </section>

    <section class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <div class="card">
        <h2 class="text-xl font-semibold mb-4" style="color: var(--text-second);">Kullanici Bilgileri</h2>

        <div class="space-y-3 text-gray-300">
          <div class="flex items-center justify-between gap-4 border-b border-white/10 pb-2">
            <span class="text-gray-400">ID</span>
            <span id="personelId" class="font-medium text-white">-</span>
          </div>

          <div class="flex items-center justify-between gap-4 border-b border-white/10 pb-2">
            <span class="text-gray-400">Tam Ad</span>
            <span id="personelName" class="font-medium text-white">-</span>
          </div>

          <div class="flex items-center justify-between gap-4 border-b border-white/10 pb-2">
            <span class="text-gray-400">E-Posta</span>
            <span id="personelEmail" class="font-medium text-white text-right">-</span>
          </div>

          <div class="flex items-center justify-between gap-4 border-b border-white/10 pb-2">
            <span class="text-gray-400">Uzmanlik</span>
            <span id="personelSpecialty" class="font-medium text-white">-</span>
          </div>

          <div class="flex items-center justify-between gap-4">
            <span class="text-gray-400">Durum</span>
            <span id="personelStatusText" class="font-medium text-white">-</span>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="flex items-start justify-between gap-3 mb-4">
          <div>
            <h2 class="text-xl font-semibold" style="color: var(--text-second);">Roller</h2>
            <p class="text-sm mt-1" style="color: var(--text-muted);">Kullanici rollerini goruntule ve guncelle.</p>
          </div>
          <button id="saveRolesBtn" class="btn btn-primary h-10" type="button" disabled>Kaydet</button>
        </div>
        <div id="rolesContainer" class="flex flex-wrap gap-2"></div>

        <div class="mt-5 pt-5" style="border-top: 1px solid var(--border);">
          <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2">
            <h3 class="font-semibold" style="color: var(--text-second);">Rol Guncelle</h3>
            <button id="resetRolesBtn" class="btn h-10" type="button" disabled>Geri Al</button>
          </div>
          <p id="rolesEditorHint" class="text-sm mt-2" style="color: var(--text-muted);">Roller yukleniyor...</p>
          <div id="rolesEditor" class="mt-3 grid grid-cols-1 sm:grid-cols-2 gap-2"></div>
          <p id="rolesUpdateMsg" class="text-sm mt-3" style="color: var(--text-muted);"></p>
        </div>
      </div>
    </section>
  </main>

  <script>
    const PERSONEL_API_ORIGIN = "http://localhost:8000";
    const API_V1 = `${PERSONEL_API_ORIGIN}/api/v1`;
    const state = {
      user: null,
      allRoles: [],
      initialRoleIds: []
    };

    function getUserIdFromQuery() {
      const params = new URLSearchParams(window.location.search);
      return params.get("UserID") || params.get("userId") || params.get("id");
    }

    function buildProfileCandidateUrls(profilePath) {
      if (!profilePath) return ["/TemplateImage/miniverse_logo.jpg"];
      if (/^https?:\/\//i.test(profilePath)) return [profilePath];

      const rawPath = String(profilePath).replace(/\\/g, "/");
      const normalized = rawPath.startsWith("/") ? rawPath : `/${rawPath}`;
      const withoutWwwroot = normalized.replace(/^\/wwwroot/i, "");
      const withWwwroot = normalized.startsWith("/wwwroot/")
        ? normalized
        : `/wwwroot${normalized}`;

      const candidates = [
        `${PERSONEL_API_ORIGIN}${normalized}`,
        `${PERSONEL_API_ORIGIN}${withoutWwwroot}`,
        `${PERSONEL_API_ORIGIN}${withWwwroot}`,
        normalized,
        withoutWwwroot,
        withWwwroot
      ];

      return [...new Set(candidates)];
    }

    function setText(id, value) {
      const el = document.getElementById(id);
      if (el) el.textContent = value ?? "-";
    }

    function showError(message) {
      const box = document.getElementById("errorMessage");
      if (!box) return;
      box.textContent = message;
      box.classList.remove("hidden");
    }

    function setRolesUpdateMsg(message, isErr) {
      const el = document.getElementById("rolesUpdateMsg");
      if (!el) return;
      el.textContent = message || "";
      el.style.color = isErr ? "#ef4444" : "var(--text-muted)";
    }

    function renderStatus(isActive) {
      const badge = document.getElementById("statusBadge");
      const statusText = isActive ? "Aktif" : "Pasif";

      if (badge) {
        badge.textContent = statusText;
        badge.className = isActive
          ? "px-2 py-1 text-xs rounded-full bg-green-100 dark:bg-green-900/50 text-green-700 dark:text-green-300"
          : "px-2 py-1 text-xs rounded-full bg-red-100 dark:bg-red-900/50 text-red-700 dark:text-red-300";
      }

      setText("personelStatusText", statusText);
    }

    function renderRoles(roles, specialty) {
      const container = document.getElementById("rolesContainer");
      if (!container) return;

      const roleList = Array.isArray(roles) && roles.length > 0
        ? roles
        : specialty
          ? [specialty]
          : [];

      container.innerHTML = "";

      if (roleList.length === 0) {
        container.innerHTML = '<span style="color: var(--text-muted);">Rol bilgisi yok.</span>';
        return;
      }

      roleList.forEach((role) => {
        const span = document.createElement("span");
        span.className = "role-chip";
        span.textContent = role;
        container.appendChild(span);
      });
    }

    function normalizeRoleNameListFromUser(user) {
      const roles = Array.isArray(user?.roles) ? user.roles.filter(Boolean) : [];
      if (roles.length > 0) return roles.map(String);
      if (user?.specialty) return [String(user.specialty)];
      return [];
    }

    function computeRoleIdsFromNames(roleNames) {
      if (!Array.isArray(roleNames) || roleNames.length === 0) return [];
      if (!Array.isArray(state.allRoles) || state.allRoles.length === 0) return [];

      const ids = [];
      roleNames.forEach((name) => {
        const found = state.allRoles.find((r) => String(r?.name) === String(name));
        if (found && typeof found.id !== "undefined") ids.push(Number(found.id));
      });
      return [...new Set(ids)].filter((v) => Number.isFinite(v));
    }

    function getSelectedRoleIds() {
      const root = document.getElementById("rolesEditor");
      if (!root) return [];
      const inputs = root.querySelectorAll('input[type="checkbox"][data-role-id]');
      const ids = [];
      inputs.forEach((input) => {
        if (input.checked) ids.push(Number(input.getAttribute("data-role-id")));
      });
      return ids.filter((v) => Number.isFinite(v));
    }

    function renderRolesEditor() {
      const root = document.getElementById("rolesEditor");
      const hint = document.getElementById("rolesEditorHint");
      const saveBtn = document.getElementById("saveRolesBtn");
      const resetBtn = document.getElementById("resetRolesBtn");
      if (!root || !hint || !saveBtn || !resetBtn) return;

      root.innerHTML = "";
      setRolesUpdateMsg("", false);

      if (!state.user) {
        hint.textContent = "Kullanici yukleniyor...";
        saveBtn.disabled = true;
        resetBtn.disabled = true;
        return;
      }

      if (!Array.isArray(state.allRoles) || state.allRoles.length === 0) {
        hint.textContent = "Roller yuklenemedi.";
        saveBtn.disabled = true;
        resetBtn.disabled = true;
        return;
      }

      hint.textContent = "Kullaniciya atanacak rolleri secin.";

      state.allRoles.forEach((role) => {
        const roleId = Number(role.id);
        const roleName = String(role.name ?? "-");

        const row = document.createElement("label");
        row.className = "roles-editor-item";

        const left = document.createElement("div");
        left.className = "flex items-center gap-3";

        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.setAttribute("data-role-id", String(roleId));
        cb.checked = state.initialRoleIds.includes(roleId);

        const text = document.createElement("span");
        text.textContent = roleName;

        left.appendChild(cb);
        left.appendChild(text);

        const right = document.createElement("span");
        right.className = "text-xs";
        right.style.color = "var(--text-muted)";
        right.textContent = `#${roleId}`;

        row.appendChild(left);
        row.appendChild(right);
        root.appendChild(row);
      });

      saveBtn.disabled = false;
      resetBtn.disabled = false;
    }

    function resetRolesEditor() {
      const root = document.getElementById("rolesEditor");
      if (!root) return;
      const inputs = root.querySelectorAll('input[type="checkbox"][data-role-id]');
      inputs.forEach((input) => {
        const id = Number(input.getAttribute("data-role-id"));
        input.checked = state.initialRoleIds.includes(id);
      });
      setRolesUpdateMsg("Degisiklikler geri alindi.", false);
    }

    function renderUser(user) {
      state.user = user;
      const fullName = user.full_name || "-";
      const email = user.email || "-";
      const specialty = user.specialty || "-";
      const isActive = Boolean(user.is_active);

      setText("fullName", fullName);
      setText("email", email);
      setText("personelId", String(user.id ?? "-"));
      setText("personelName", fullName);
      setText("personelEmail", email);
      setText("personelSpecialty", specialty);
      setText("specialtyBadge", specialty);

      renderStatus(isActive);
      renderRoles(user.roles, specialty);
      maybeInitRolesEditor();
      
      const profileImage = document.getElementById("profileImage");
      if (profileImage) {
        const imageCandidates = buildProfileCandidateUrls(user.profile);
        let candidateIndex = 0;

        const tryNextImage = () => {
          if (candidateIndex >= imageCandidates.length) {
            profileImage.onerror = null;
            profileImage.src = "/TemplateImage/miniverse_logo.jpg";
            return;
          }

          profileImage.src = imageCandidates[candidateIndex];
          candidateIndex += 1;
        };

        profileImage.onerror = tryNextImage;
        tryNextImage();
      }
    }

    function maybeInitRolesEditor() {
      if (!state.user) return;
      if (!Array.isArray(state.allRoles) || state.allRoles.length === 0) return;

      const currentNames = normalizeRoleNameListFromUser(state.user);
      state.initialRoleIds = computeRoleIdsFromNames(currentNames);
      renderRolesEditor();
    }

    async function loadAllRoles() {
      try {
        const res = await fetch(`${API_V1}/Role/AllRoles`, { credentials: "include" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const roles = await res.json();
        state.allRoles = Array.isArray(roles) ? roles : [];
        maybeInitRolesEditor();
      } catch (err) {
        console.error("Roller alinamadi:", err);
        state.allRoles = [];
        renderRolesEditor();
      }
    }

    async function updateUserRoles() {
      if (!state.user?.id) {
        setRolesUpdateMsg("Kullanici yuklenmedi.", true);
        return;
      }

      const selectedIds = getSelectedRoleIds();
      if (selectedIds.length === 0) {
        setRolesUpdateMsg("En az 1 rol secmelisin.", true);
        return;
      }

      const saveBtn = document.getElementById("saveRolesBtn");
      const resetBtn = document.getElementById("resetRolesBtn");
      if (saveBtn) saveBtn.disabled = true;
      if (resetBtn) resetBtn.disabled = true;
      setRolesUpdateMsg("Kaydediliyor...", false);

      try {
        const res = await fetch(`${API_V1}/Role/UpdateUserRole`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({ id: state.user.id, role_ids: selectedIds })
        });

        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        state.initialRoleIds = [...selectedIds];
        const selectedNames = state.allRoles
          .filter((r) => selectedIds.includes(Number(r.id)))
          .map((r) => String(r.name));
        renderRoles(selectedNames, state.user.specialty);

        setRolesUpdateMsg("Rol guncellendi.", false);
      } catch (err) {
        console.error("Rol guncelleme basarisiz:", err);
        setRolesUpdateMsg("Rol guncellenemedi. Endpoint veya yetkiyi kontrol et.", true);
      } finally {
        if (saveBtn) saveBtn.disabled = false;
        if (resetBtn) resetBtn.disabled = false;
      }
    }

    async function loadUserDetails() {
      const userId = getUserIdFromQuery();

      if (!userId) {
        showError("UserID parametresi bulunamadi.");
        return;
      }

      try {
        const response = await fetch(`${API_V1}/personel/GetByIdPersonel/${encodeURIComponent(userId)}`, {
          method: "GET",
          headers: {
            "Content-Type": "application/json"
          },
          credentials: "include"
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const user = await response.json();
        renderUser(user);
      } catch (error) {
        console.error("Kullanici detayi alinamadi:", error);
        showError("Kullanici bilgileri alinamadi. Endpoint veya yetkiyi kontrol et.");
      }
    }

    document.addEventListener("DOMContentLoaded", async () => {
      if (typeof Theme !== "undefined" && typeof Theme.renderToggle === "function") {
        Theme.renderToggle("themeBtn");
      }

      if (typeof getCurrentUser === "function") {
        try {
          await getCurrentUser();
        } catch (_) {
          // Auth kontrolu varsa sessiz devam et
        }
      }

      loadUserDetails();
      loadAllRoles();

      const saveBtn = document.getElementById("saveRolesBtn");
      const resetBtn = document.getElementById("resetRolesBtn");
      if (saveBtn) saveBtn.addEventListener("click", updateUserRoles);
      if (resetBtn) resetBtn.addEventListener("click", resetRolesEditor);
    });
  </script>

  <script src="MenuLoader.js"></script>
  <script src="auth.js"></script>
  <script src="AdminMenuOptions.js"></script>
  <script src="Template.js"></script>
</body>
</html>
